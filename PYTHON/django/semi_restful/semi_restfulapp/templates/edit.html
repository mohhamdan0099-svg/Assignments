<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create</title>
</head>
<body>
    <h1>Edit Show {{show.id}}</h1> 
    <a href="/shows">Go Back</a>
    <form action="/shows/edit/{{show.id}}/update/" method="post">
        {% csrf_token %}
    <label for="title">Title</label>
    <input type="text" name="title" id="title" value="{{show.title}}">

    <label for="network">Network</label>
    <input type="text" name="network" id="network" value="{{show.network}}">

    <label for="date">Release Date</label>
    <input type="date" name="date" id="date" value="{{show.release_date}}">
    

    <label for="desc">Description</label>
    <input type="text" name="desc" id="desc" value="{{show.description}}">
    
    <button type="submit">update</button>
        </form>
</body>
</html>
