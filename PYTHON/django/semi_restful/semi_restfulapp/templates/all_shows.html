<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shows</title>
</head>
<body>
    <h1>All Shows </h1>
    
    <table>
        <thead>
            <th>ID</th>
            <th>Title</th>
            <th>Network</th>
            <th>Release Date</th>
            <th>Actions</th>
        </thead>
        {%for show in all_shows %}
        <tr>
            <td>{{show.id}}</td>
            <td>{{show.title}}</td>
            <td>{{show.network}}</td>
            <td>{{show.release_date}}</td>
            <td><a href="/shows/{{show.id}}">show</a> <a href="/shows/edit/{{show.id}}">Edit</a> <a href="delete/{{show.id}}">Delete</a></td>

        </tr>
        {%endfor%}
    </table>
    <a href="new/">Add a new show </a>
</body>
</html>
