<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Books Dashboard</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<body class="p-3 mb-2 bg-subtle-success fg-success">
    <h1>Books Home Page</h1>
    <hr>
    <h3><strong>Books</strong> | <a href="/authors">Authors</a></h3>
        <hr>

    <h2>Add a Book</h2>
    <form action="/books/create" method="POST">
        {% csrf_token %}
        
        <p>Title: <input type="text" name="title"></p>
        <p>Description: <textarea name="desc"></textarea></p>
        <input  type="submit" value="Add">
    </form>

    <hr>

    <h2>All Books</h2>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Action</th>
        </tr>
        {% for book in all_books %}
        <tr>
            <td>{{ book.id }}</td>
            <td>{{ book.title }}</td>
            <td><a href="/books/{{ book.id }}">View</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
