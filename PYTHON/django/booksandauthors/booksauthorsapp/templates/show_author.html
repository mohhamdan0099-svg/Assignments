<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ author.first_name }} {{ author.last_name }}</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

<body class="p-3 mb-2 bg-subtle-accent fg-accent">
    <p><a href="/">Books</a> | <a href="/authors">Authors Dashboard</a></p>
    <hr>
    <h1>{{ author.first_name }} {{ author.last_name }}</h1>
    <p><strong>ID:</strong> {{ author.id }}</p>
    <p><strong>Notes:</strong> {{ author.notes }}</p>

    <h2>Books:</h2>
    <ul>
        {% for book in author.books.all %}
            <li>{{ book.title }}</li>
        {% endfor %}
    </ul>

    <form action="/authors/{{ author.id }}/add_book" method="POST">
        {% csrf_token %}
        <select name="book_id">
            {% for book in all_books %}
                <option value="{{ book.id }}">{{ book.title }}</option>
            {% endfor %}
        </select>
        <input  type="submit" value="Add">
    </form>
</body>
</html>
