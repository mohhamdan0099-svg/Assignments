<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authors Dashboard</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<body class="p-3 mb-2 bg-subtle-accent fg-accent">
    <h1>Authors Home Page</h1>
    <hr>
    <h3><a href="/">Books</a> | <strong>Authors</strong></h3>
    <hr>
    <h2>Add an Author</h2>
    <form action="/authors/create" method="POST">
        {% csrf_token %}
        <p>First Name: <input type="text" name="first_name"></p>
        <p>Last Name: <input type="text" name="last_name"></p>
        <p>Notes: <textarea name="notes"></textarea></p>
        <input  type="submit" value="Add">
    </form>

    <hr>

    <h2>All Authors</h2>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Action</th>
        </tr>
        {% for author in all_authors %}
        <tr>
            <td>{{ author.id }}</td>
            <td>{{ author.first_name }} {{ author.last_name }}</td>
            <td><a href="/authors/{{ author.id }}">View</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
