<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}User Dashboard{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f9f9f9; }
        nav { display: flex; justify-content: space-between; background: #333; color: white; padding: 10px 20px; align-items: center; }
        nav a { color: white; text-decoration: none; margin-left: 15px; }
        .error { color: red; list-style-type: none; padding: 0; }
        .card { background: white; padding: 20px; margin-top: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #eee; }
    </style>
</head>
<body>

    <nav>
        <div><strong>Test App</strong></div>
        <div>
            <a href="/dashboard/">Dashboard</a>
            {% if request.session.user_id %}
                <a href="/users/edit/">Profile</a>
                <a href="/logout/">Log off</a>
            {% else %}
                <a href="/signin/">Sign In</a>
            {% endif %}
        </div>
    </nav>

    {% if messages %}
        <ul class="error">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <div class="content">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
