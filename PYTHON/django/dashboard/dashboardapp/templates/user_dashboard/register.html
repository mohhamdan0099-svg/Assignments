{% extends 'user_dashboard/base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: auto;">
    <h2>Register</h2>
    <form action="/register/process/" method="POST">
        {% csrf_token %}
        <p>Email Address:<br><input type="email" name="email" required style="width: 100%; padding: 8px;"></p>
        <p>First Name:<br><input type="text" name="first_name" required style="width: 100%; padding: 8px;"></p>
        <p>Last Name:<br><input type="text" name="last_name" required style="width: 100%; padding: 8px;"></p>
        <p>Password:<br><input type="password" name="password" required style="width: 100%; padding: 8px;"></p>
        <p>Password Confirmation:<br><input type="password" name="password_confirm" required style="width: 100%; padding: 8px;"></p>
        <button type="submit" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 3px;">Register</button>
    </form>
    <p style="margin-top: 15px;"><a href="/signin/">Already have an account? Sign In</a></p>
</div>
{% endblock %}
