{% extends 'user_dashboard/base.html' %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: auto;">
    <h2>Sign In</h2>
    <form action="/login/" method="POST">
        {% csrf_token %}
        <p>Email Address:<br><input type="email" name="email" required style="width: 100%; padding: 8px;"></p>
        <p>Password:<br><input type="password" name="password" required style="width: 100%; padding: 8px;"></p>
        <button type="submit" style="padding: 10px 20px; background: #007BFF; color: white; border: none; border-radius: 3px;">Sign In</button>
    </form>
    <p style="margin-top: 15px;"><a href="/register/">Don't have an account? Register</a></p>
</div>
{% endblock %}
