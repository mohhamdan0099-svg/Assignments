<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users with Templates</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<body  class="p-3 mb-2 bg-subtle-secondary fg-secondary">

    <h1 class="fg-emphasis-inverse">All the Users</h1>
    
    
    <table class="table theme-info">
        <thead>
            <tr  >
                <th  >ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Age</th>
                <th>created at</th>
                <th>updated at</th>
                <th>delete user</th>

            </tr>
        </thead>
        <tbody>
            
            {% for user in all_the_users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.first_name }} {{ user.last_name }}</td>
                <td>{{ user.email_address }}</td>
                <td>{{ user.age }}</td>
                <td>{{user.created_at}}</td>
                <td>{{user.updated_at}}</td>
                <td><form action="/delete/{{user.id}}" method="post">
                {% csrf_token %}
                <button class="btn-solid btn-styled theme-danger"  type="submit">delete user</button>

                </form></td>
                
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <hr>

    
    <h2 class="fg-emphasis-inverse">Add a User</h2>
    
    <form action="/create_user" method="POST" class="input-group">
        {% csrf_token %}
        <div>
            <label class="fg-emphasis-inverse">First Name:</label>
            <input type="text" name="first_name">
        </div>
        <div>
            <label class="fg-emphasis-inverse">Last Name:</label>
            <input type="text" name="last_name">
        </div>
        <div>
            <label class="fg-emphasis-inverse">Email:</label>
            <input type="text" name="email">
        </div>
        <div>
            <label class="fg-emphasis-inverse">Age:</label>
            <input type="number" name="age">
        </div>
        <button class="btn-solid btn-styled theme-success "> Add user</button>
    </form>
    

</body>
</html>
