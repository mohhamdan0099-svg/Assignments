<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Likes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="same-col">
        <header>
            <h1>Network </h1>
        </header>

        <h2>Your Feed</h2>
        <div class="same-row">
    
                <aside>
                    <div> <img src="/user-circle.png" alt="" width="60px"> </div>
                    <div>  <a href="#">Add on avatar</a></div>
                    <div> <h3>James Doe</h3></div>
                </aside>

            <div class="three-boxes">
                <div class="box-1">
                    <div class="conti">

                        <h3>Neil M </h3>

                        <p><span class="count-1">9</span> like(s) 
                        <button onclick="increase1()">like</button> </p>
                    </div>
                    <div class="conti">
                        <p>I just set up this new discord bot,let me know what you all think <a href="#">link</a></p>

                    </div>
                </div>


                <div class="box-2">
                    <div class="conti">
                        <h3>Nichole K</h3>

                        <p><span class="count-2">12</span> like(s) 
                        <button onclick="increase2()">like</button>  </p>
                    </div>
                    <div class="conti">
                        <p>Just finished my <a href="#">next comic,</a> check it out.</p>
                    </div>
                </div>   

                <div class="box-3"> 
                    <div class="conti">
                        <h3>Jim R </h3> 
                        <p><span class="count-3">9</span> like(s) 
                        <button onclick="increase3()">like</button> </p>
                    </div>
                    <div class="conti">
                        <p >I can't stop listening to the <a href="#">new album.</a> who else is liking it?</p>
                    </div>
                </div>

            </div>
        </div>
    </div>
    </div>
<script src="script.js"></script>
</body>
</html>
